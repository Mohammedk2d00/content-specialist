# Builds the one-file Arabic Windows installer (UOWA-Setup.exe) on a Windows runner, so no Windows PC is needed locally.
# Run: start it by hand from the Actions tab (or push a v* tag). It publishes UOWA-Setup.exe as a GitHub Release named v<app version>.
name: installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/stage-installer.js
      - run: choco install innosetup -y --no-progress
      - name: Compile with Inno Setup
        shell: bash
        run: |
          export APP_VERSION=$(node -p "require('./app/package.json').version")
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: UOWA-Setup
          path: installer/out/UOWA-Setup.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./app/package.json').version")"
          # a re-run replaces the file instead of failing
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" installer/out/UOWA-Setup.exe --clobber \
            || gh release create "$TAG" installer/out/UOWA-Setup.exe --title "UOWA Content Specialist $TAG" --notes "Download UOWA-Setup.exe and double-click it."
