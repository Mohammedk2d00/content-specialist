<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post draft</title>
<style>/* Draft page styles. build.js inlines this file at the template's style marker, so the built page stays one offline file.
   Class names are set by the page's JS: rename none of them. */
:root{--navy:#091F5E;--navy2:#16307e;--gold:#FAC13E;--gold2:#f5b800;--blue:#091F5E;--soft:#eef1fd;--bg:#f4f6fb;--card:#fff;
  --line:#e4e8f1;--text:#1c2438;--muted:#6b7488;--ok:#1f9d6b;--okbg:#e3f6ed;--r:14px;--rs:10px;
  --sh1:0 1px 2px rgba(9,31,94,.06),0 2px 8px rgba(9,31,94,.05);--sh2:0 4px 10px rgba(9,31,94,.07),0 14px 34px rgba(9,31,94,.09);
  --ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
button{font:inherit}
:focus-visible{outline:3px solid rgba(250,193,62,.8);outline-offset:2px}

/* Header: sticky, so the page language and status stay in view. Not animated: it is rebuilt on every Done tick. */
header{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 2px 0 var(--gold),0 6px 20px rgba(9,31,94,.18);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
img.logo{object-fit:contain;background:#fff;padding:3px;box-shadow:0 0 0 2px rgba(250,193,62,.6)}
h1{font-size:19px;margin:0;line-height:1.35}.sub{color:#c9d3ee;font-size:12.5px}.grow{flex:1;min-width:200px}
.uit{display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.08);border-radius:99px;padding:3px}
.uil{color:#c9d3ee;font-size:12px;padding:0 8px}
.uib{border:0;background:transparent;color:#fff;border-radius:99px;padding:5px 14px;cursor:pointer;font-size:13px;transition:background .2s,color .2s}
.uib:hover{background:rgba(255,255,255,.12)}
.uib.on{background:var(--gold);color:var(--navy);font-weight:700}
.badge{background:#fff3d1;color:#7a5600;padding:5px 13px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.part{background:#e6ecff;color:#2f3f9e}.badge.ok{background:var(--okbg);color:#17744f}

/* Main card that mirrors the dashboard's Add Post window */
.how{background:var(--soft);border-inline-start:4px solid var(--navy);border-radius:var(--rs);padding:12px 16px;font-size:14px;margin:22px 0 16px}
.modal{background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);overflow:hidden}
.modal-h{padding:18px 22px;font-size:18px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.modal-h span{color:var(--muted);font-size:13px;font-weight:400;background:var(--bg);padding:3px 12px;border-radius:99px}
.tabs{display:flex;gap:6px;padding:6px;margin:0 22px;background:var(--bg);border-radius:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;background:none;border:0;padding:10px 14px;color:var(--muted);cursor:pointer;border-radius:9px;white-space:nowrap;scroll-snap-align:start;transition:background .25s var(--ease),color .25s,box-shadow .25s}
.tab:hover{color:var(--navy);background:rgba(255,255,255,.6)}
.tab.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:var(--sh1),inset 0 -3px 0 var(--gold)}
.panel{padding:10px 22px 24px;display:none}
.panel.on{display:block;animation:slideIn .35s var(--ease)}

/* One field to copy */
.row{padding:16px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .25s,opacity .3s,transform .25s var(--ease)}
.row:hover{border-color:#cdd5ea;box-shadow:var(--sh1)}
.row.done{opacity:.6;border-color:#bfe8d3;background:#fbfefc}
.lab{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-size:12px;transition:background .3s}
.row.done .num{background:var(--ok)}
.dn{margin-inline-start:auto;font-weight:400;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
.dn input{accent-color:var(--ok);width:17px;height:17px;cursor:pointer}
.how-to{color:var(--muted);font-size:13px;margin:4px 0 10px}
.val{background:#f8f9fd;border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;font-size:16px;overflow-wrap:anywhere}
.line{display:flex;gap:10px;align-items:flex-start}.line>.val,.line>.inp{flex:1;min-width:0}
.inp{display:block;width:100%;font-size:16px;color:var(--text);background:#fff;border:1px solid #cdd4e6;border-radius:var(--rs);padding:10px 12px;transition:border-color .2s,box-shadow .2s}
textarea.inp{resize:vertical;min-height:54px;line-height:1.7;font-family:inherit}
.inp:focus,.editor:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 4px rgba(9,31,94,.12)}

/* Buttons */
.copy,.btn2,.apbtn,.tbb,.chiplab,.chipx{transition:transform .12s,background .2s,box-shadow .2s,color .2s,border-color .2s}
.copy:active,.btn2:active,.apbtn:active,.tbb:active{transform:scale(.96)}
.copy{background:var(--navy);color:#fff;border:0;border-radius:var(--rs);padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(9,31,94,.2)}
.copy:hover{background:var(--navy2)}
.copy.ok{background:var(--ok);animation:pop .35s var(--ease)}
.btn2{border:1px solid var(--line);background:#fff;border-radius:var(--rs);padding:10px 20px;cursor:pointer;color:var(--text)}
.btn2:hover{border-color:var(--navy);color:var(--navy)}
.btn2.go{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 3px 10px rgba(9,31,94,.22)}
.btn2.go:hover{background:var(--navy2);color:#fff}

/* Tags */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;background:var(--soft);border:1px solid #d5d9fb;border-radius:99px;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--navy)}
.chip.ok{background:var(--okbg);border-color:#bfe8d3;animation:pop .35s var(--ease)}
.chiplab{background:none;border:0;padding:7px 6px;padding-inline-start:14px;color:var(--navy);cursor:pointer}
.chipx{background:none;border:0;padding:7px 12px;padding-inline-start:4px;color:#b23a3a;cursor:pointer;font-size:17px;line-height:1;border-radius:99px}
.chipx:hover{color:#fff;background:#d04646}
.flag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}.flag.you{background:#fff3d1;color:#7a5600}.flag.na{background:#eceff5;color:var(--muted)}
.chks{display:flex;gap:10px;flex-wrap:wrap}.chk{border:1px solid var(--line);border-radius:var(--rs);padding:8px 14px;background:#f8f9fd;font-size:14px}.chk b{display:block}

/* Rich text editor */
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tbb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)}
.tbb:hover{background:var(--soft);border-color:#c5cdf3}
.editor{min-height:220px;border:1px solid #cdd4e6;border-radius:var(--rs);padding:14px 18px;background:#fff;font-size:16px;line-height:1.9;margin-bottom:10px;cursor:text;transition:border-color .2s,box-shadow .2s}
.editor h2,.editor h3{color:var(--navy)}.editor p{margin:0 0 12px}

/* Step navigation and Approved */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap}.final{color:var(--muted);font-size:14px}
.apwrap{display:flex;direction:ltr;justify-content:flex-end;align-items:center;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.apnote{color:var(--muted);font-size:13px;direction:inherit}
.apbtn{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--navy);border:0;border-radius:12px;padding:13px 32px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #c08c00,0 8px 18px rgba(245,184,0,.35)}
.apbtn:hover{filter:brightness(1.04)}
.apbtn:active{box-shadow:0 1px 0 #c08c00;transform:translateY(3px)}
.apbtn.on{background:linear-gradient(180deg,#ffe28a,#ffd75a);box-shadow:0 0 0 2px var(--navy),0 4px 0 #c08c00;animation:pop .4s var(--ease)}

/* Notes under the card */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:24px 0}
.note{background:var(--card);border-top:4px solid var(--gold);border-radius:12px;padding:14px 18px;box-shadow:var(--sh1);animation:fadeUp .4s var(--ease) both}
.note:nth-child(2){animation-delay:.06s}.note:nth-child(3){animation-delay:.12s}.note:nth-child(4){animation-delay:.18s}
.note h3{margin:0 0 8px;font-size:15px;color:var(--navy)}.note ul{margin:0;padding-inline-start:18px;font-size:14px}.note li{margin-bottom:4px}.note .empty{color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 16px}
.err{background:#fde8e8;color:#8a1c1c;padding:16px;border-radius:var(--rs);margin:20px 0}

@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}

/* Phones: stack the copy button under its value and tighten spacing */
@media (max-width:600px){
  header{position:static;padding:12px 0}
  h1{font-size:17px}.grow{min-width:0;flex-basis:calc(100% - 60px)}
  .modal-h{padding:14px 16px;font-size:16px}.tabs{margin:0 12px}.tab{flex:none;padding:9px 12px}
  .panel{padding:6px 12px 18px}.row{padding:12px}
  .line{flex-direction:column;align-items:stretch}.copy{width:100%;padding:12px}
  .apwrap{justify-content:stretch}.apwrap>*{flex:1 1 100%}.apbtn{width:100%}
  .nav .btn2{flex:1}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  notes:['تفاصيل يمكنك إضافتها','عبارات عامة أضافها الوكيل','خيارات تحتاج تأكيدك'],nothing:'لا شيء للإبلاغ.',factsT:'الحقائق التي أعطيتها للوكيل',factsNone:'لا شيء. أعطى المستخدم عنواناً فقط، لذلك يجب ألا يحتوي المنشور على أسماء أو أرقام أو تواريخ محددة.',factsMiss:'لا توجد قائمة حقائق في هذه المسودة. راجع بنفسك كل اسم ورقم وتاريخ في المنشور.',foot:'كُتبت بواسطة وكيل المحتوى. راجع كل شيء قبل النشر.',
  bold:'ع',h2:'عنوان ١',h3:'عنوان ٢',para:'¶',ul:'•',ol:'١.'}
};

function hash(s){ var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
var USE = D.posts.map(function(p){ return {sub:!!p.sub_content, content:!!p.content_html, tags:!!(p.tags && p.tags.length)}; });
var KEY = 'uowa-draft2:' + hash(JSON.stringify(D));
D.posts.forEach(function(p){ p.tags = p.tags || []; p.sub_content = p.sub_content || ''; p.content_html = p.content_html || ''; p.image_suggestion = p.image_suggestion || ''; p.attachments = p.attachments || ''; });

function postFor(l){ for (var i = 0; i < D.posts.length; i++) if ((D.posts[i].dir === 'rtl') === (l === 'ar')) return i; return -1; }
UI = D.posts[0].dir === 'rtl' ? 'ar' : 'en';
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ui:UI, done:done, approved:approved, posts:D.posts.map(function(p){ var q = {}; EDIT.forEach(function(k){ q[k] = p[k]; }); return q; })})); } catch(e) {} }
(function(){ try {
  var o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!o) return;
  if ((o.ui === 'ar' || o.ui === 'en') && postFor(o.ui) > -1) UI = o.ui;
  done = o.done || {}; approved = o.approved || {};
  (o.posts || []).forEach(function(q, i){ if (D.posts[i]) EDIT.forEach(function(k){ if (q[k] !== undefined) D.posts[i][k] = q[k]; }); });
} catch(e) {} })();
function t(k){ return T[UI][k]; }

/* HTML clean-up: only what the dashboard editor accepts */
var KEEP = {P:1,H2:1,H3:1,UL:1,OL:1,LI:1,STRONG:1,A:1,BR:1}, DROP = {SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,TEMPLATE:1,NOSCRIPT:1}, SWAP = {B:'strong',DIV:'p'};
function clean(html){
  var doc = new DOMParser().parseFromString('<body>' + html, 'text/html');
  (function walk(node){
    [].slice.call(node.childNodes).forEach(function(c){
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1 || DROP[c.tagName]) { node.removeChild(c); return; }
      if (SWAP[c.tagName]) { var r = doc.createElement(SWAP[c.tagName]); while (c.firstChild) r.appendChild(c.firstChild); node.replaceChild(r, c); c = r; }
      walk(c);
      if (!KEEP[c.tagName]) { while (c.firstChild) node.insertBefore(c.firstChild, c); node.removeChild(c); return; }
      var href = c.tagName === 'A' ? c.getAttribute('href') : null;
      [].slice.call(c.attributes).forEach(function(a){ c.removeAttribute(a.name); });
      if (href && /^(https?:|mailto:)/i.test(href.trim())) c.setAttribute('href', href.trim());
    });
  })(doc.body);
  return doc.body.innerHTML;
}

function flash(b, txt){ var o = b.getAttribute('data-o') || b.textContent; b.setAttribute('data-o', o); b.textContent = txt || t('copied'); b.classList.add('ok'); setTimeout(function(){ b.textContent = o; b.classList.remove('ok'); }, 1400); }

}
function copyRich(node, b){ var s = window.getSelection(), r = document.createRange(); r.selectNodeContents(node); s.removeAllRanges(); s.addRange(r); var ok = false; try { ok = document.execCommand('copy'); } catch(e) {} s.removeAllRanges(); flash(b, ok ? t('copied') : t('manual')); }

function fmt(iso){ try { return new Date(iso).toLocaleString(UI === 'ar' ? 'ar-IQ' : 'en-GB'); } catch(e) { return iso; } }

function inp(p, key){ var i = el('input', {type:'text', class:'inp', dir:'auto'}); i.value = p[key] || ''; i.addEventListener('input', function(){ p[key] = i.value; touch(); }); return i; }

function editor(p){
  var ed = el('div', {class:'editor', contenteditable:'true', dir:p.dir, spellcheck:'false'});

  var tb = el('div', {class:'tb'});

  tool(t('bold'), function(){ document.execCommand('bold'); });

  tool(t('h3'), function(){ document.execCommand('formatBlock', false, 'h3'); });

  return el('div', null, tb, ed, el('div', {class:'line'}, btn(t('copyRich'), function(b){ copyRich(ed, b); }), el('div', {class:'how-to'}, t('richHint'))));
}
function tagsEditor(p){
  var chips = el('div', {class:'chips'});
  p.tags.forEach(function(tg, i){
    var lab = el('button', {type:'button', class:'chiplab'}, tg), chip = el('span', {class:'chip'}, lab);
    lab.addEventListener('click', function(){ copyText(tg, lab); chip.classList.add('ok'); setTimeout(function(){ chip.classList.remove('ok'); }, 1400); });
    var x = el('button', {type:'button', class:'chipx', title:t('remove')}, '×');

  });
  var add = el('input', {type:'text', class:'inp tag-input', dir:'auto', placeholder:t('tagPh')});
  add.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ',' || e.key === '،') { e.preventDefault(); var v = add.value.trim();
      if (v) { p.tags.push(v); touch(); render(); var ni = document.querySelector('.tag-input'); if (ni) ni.focus(); } }
  });
  return el('div', null, chips, add, el('div', {class:'line', style:'margin-top:10px'}, btn(t('copyAll'), function(b){ copyText(p.tags.join(', '), b); })));
}

function field(key, label, how, content, flag){
  var id = cur + '-' + key; fieldIds.push(id);
  var row = el('div', {class:'row'}); n += 1;
  var box = el('input', {type:'checkbox'}); box.checked = !!done[id];
  box.addEventListener('change', function(){ done[id] = box.checked; row.classList.toggle('done', box.checked); save(); refreshStatus(); });
  row.appendChild(el('div', {class:'lab'}, el('span', {class:'num'}, n), label, flag ? el('span', {class:'flag ' + flag[0]}, flag[1]) : null, el('label', {class:'dn'}, box, ' ' + t('done'))));
  if (how) row.appendChild(el('div', {class:'how-to'}, how));
  if (content) row.appendChild(content);
  row.classList.toggle('done', !!done[id]);
  return row;
}
function chk(name, on){ return el('div', {class:'chk'}, el('b', null, name), on === null ? t('choice') : (on ? t('keep') : t('unt'))); }
function sName(p){ return UI === 'ar' ? (p.structure_ar || MAP[p.structure] || p.structure) : p.structure; }
function basicPanel(p){ return [
  field('lang', t('lang'), t('hChoose'), el('div', {class:'val', dir:'auto'}, p.language)),
  field('struct', t('struct'), t('hChoose'), el('div', {class:'val', dir:'auto'}, sName(p))),
  field('cat', t('cat'), t('hCat'), inp(p, 'category')),
  field('title', t('title'), t('hTitle'), withCopy(p, 'title', inp(p, 'title'))),
  field('url', t('url'), t('hNo'), null, ['you', t('you')]),
  field('pub', t('pub'), t('hNo'), null, ['you', t('you')]),
  field('chk', t('chks'), t('hChk'), el('div', {class:'chks'}, chk(t('show'), p.show_published_at !== false), chk(t('active'), p.active !== false), chk(t('notif'), null)))
]; }
function contentPanel(p, u){ var r = [];
  r.push(u.sub ? field('sub', t('sub'), t('hSub'), withCopy(p, 'sub_content', area(p, 'sub_content'))) : field('sub', t('sub'), t('leaveSub'), null, ['na', t('notUsed')]));
  r.push(u.content ? field('content', t('content'), t('hContent'), editor(p)) : field('content', t('content'), t('leaveEd'), null, ['na', t('notUsed')]));
  return r; }
function tagsPanel(p, u){ return [u.tags ? field('tags', t('tags'), t('hTags'), tagsEditor(p)) : field('tags', t('tags'), t('leaveTags'), null, ['na', t('notUsed')])]; }
function mediaPanel(p){ return [
  field('img', t('img'), t('hImg'), area(p, 'image_suggestion'), ['you', t('upl')]),
  field('att', t('att'), t('hAtt'), area(p, 'attachments'), ['you', t('upl')])
]; }
function notes(){
  var r = (UI === 'ar' && D.review_ar) ? D.review_ar : (D.review || {});
  var defs = [[t('notes')[0], r.missing], [t('notes')[1], r.general], [t('notes')[2], r.confirm]];
  var box = el('div', {class:'notes'});
  defs.forEach(function(d){ var card = el('div', {class:'note'}, el('h3', null, d[0]));
    if (d[1] && d[1].length) { var ul = el('ul'); d[1].forEach(function(x){ ul.appendChild(el('li', null, UI === 'ar' ? arx(x) : x)); }); card.appendChild(ul); }
    else card.appendChild(el('div', {class:'empty'}, t('nothing')));
    box.appendChild(card); });
  var fc = el('div', {class:'note', style:'border-top-color:var(--blue)'}, el('h3', null, t('factsT')));
  if (Array.isArray(D.source_facts) && D.source_facts.length) { var fu = el('ul'); D.source_facts.forEach(function(x){ fu.appendChild(el('li', {dir:'auto'}, x)); }); fc.appendChild(fu); }
  else fc.appendChild(el('div', {class:'empty'}, Array.isArray(D.source_facts) ? t('factsNone') : t('factsMiss')));
  box.appendChild(fc);
  return box;
}

function pendingCount(){ return fieldIds.filter(function(id){ return !done[id]; }).length; }
function approvedCount(){ var c = 0; D.posts.forEach(function(x, i){ if (approved[i]) c += 1; }); return c; }
function dashPayload(p){
  var sa = p.structure_ar || (D.posts.filter(function(q){ return q.structure === p.structure && q.structure_ar; })[0] || {}).structure_ar || MAP[p.structure] || '';
  return JSON.stringify({uowa_post:1, language:p.language, structure:p.structure, structure_ar:sa, category:p.category, title:p.title, sub_content:p.sub_content, content_html:clean(p.content_html), tags:p.tags, show_published_at:p.show_published_at !== false, active:p.active !== false});
}
function silentCopy(txt){
  function fb(){ var ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e) {} document.body.removeChild(ta); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).catch(fb); else fb();
}
function exportEdits(){
  try {
    var o = JSON.parse(JSON.stringify(D)); delete o.draft_id;
    o.owner_approved_at = {}; D.posts.forEach(function(p, i){ if (approved[i]) o.owner_approved_at[p.dir] = approved[i]; });
    o.edited_at = new Date().toISOString();
    var blob = new Blob([JSON.stringify(o, null, 2)], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = (D.draft_id || decodeURIComponent((location.pathname.split('/').pop() || 'draft')).replace(/\.html?$/i, '') || 'draft') + '.edited.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    return true;
  } catch(e) { return false; }
}
function buildApprove(){
  var on = !!approved[cur];
  var note = el('div', {class:'apnote', dir:UI === 'ar' ? 'rtl' : 'ltr'}, on ? t('apAt') + fmt(approved[cur]) + '. ' + t('apCopied') + ' ' + t('edSaved') : t('apPend')(pendingCount()) + '. ' + t('apClear'));
  var b = el('button', {type:'button', class:'apbtn' + (on ? ' on' : '')}, on ? t('apOn') : t('ap'));
  b.addEventListener('click', function(){ if (approved[cur]) delete approved[cur]; else { approved[cur] = new Date().toISOString(); silentCopy(dashPayload(D.posts[cur])); save(); exportEdits(); } save(); refreshStatus(); });
  var again = on ? btn(t('copyAgain'), function(x){ silentCopy(dashPayload(D.posts[cur])); flash(x, t('copied')); }) : null;
  var saveBtn = btn(t('saveEd'), function(x){ if (exportEdits()) flash(x, '✓'); });
  return el('div', {class:'apwrap', id:'apbox'}, note, saveBtn, again, b);
}
function renderHeader(){
  hdr.innerHTML = '';
  var title = (UI === 'ar' && D.request_title_ar) ? D.request_title_ar : (D.request_title || '');
  document.title = title;
  var ui = el('div', {class:'uit'}, el('span', {class:'uil'}, t('pageLang')));
  [['ar', 0], ['en', 1]].forEach(function(x){
    var i = postFor(x[0]); if (i < 0) return;
    var b = el('button', {type:'button', class:'uib' + (UI === x[0] ? ' on' : '')}, t('langNames')[x[1]] + (approved[i] ? ' ✓' : ''));
    b.addEventListener('click', function(){ UI = x[0]; save(); applyUI(); });
    ui.appendChild(b);
  });
  var c = approvedCount(), m = D.posts.length;
  hdr.appendChild(LOGO ? el('img', {class:'logo', src:LOGO, alt:''}) : el('div', {class:'logo'}, t('logo')));
  hdr.appendChild(el('div', {class:'grow'}, el('h1', null, title), el('div', {class:'sub'}, (D.created ? t('created') + ' ' + D.created + '  |  ' : '') + t('path'))));
  hdr.appendChild(ui);
  hdr.appendChild(el('span', {class:'badge' + (c === m ? ' ok' : (c > 0 ? ' part' : '')), id:'badge'}, c === m ? t('all') : (c > 0 ? t('part')(c, m) : t('draft'))));
}
function refreshStatus(){ renderHeader(); var old = document.getElementById('apbox'); if (old) old.parentNode.replaceChild(buildApprove(), old); }
function render(){
  var y = window.pageYOffset; app.innerHTML = ''; n = 0; fieldIds = [];
  var p = D.posts[cur], u = USE[cur];
  app.appendChild(el('div', {class:'how'}, el('b', null, t('how')), t('howT')));
  var tabsBar = el('div', {class:'tabs'});
  t('tabs').forEach(function(name, i){ var b = el('button', {type:'button', class:'tab' + (i === tab ? ' on' : '')}, (i + 1) + '. ' + name); b.addEventListener('click', function(){ tab = i; render(); }); tabsBar.appendChild(b); });
  var panels = [basicPanel(p), contentPanel(p, u), tagsPanel(p, u), mediaPanel(p)];
  var modal = el('div', {class:'modal'}, el('div', {class:'modal-h'}, t('addPost'), el('span', null, p.language + '  |  ' + sName(p))), tabsBar);
  panels.forEach(function(rows, i){
    var pn = el('div', {class:'panel' + (i === tab ? ' on' : '')}, rows);
    if (i === tab) {
      var nav = el('div', {class:'nav'}), back = el('button', {type:'button', class:'btn2'}, t('back'));
      back.addEventListener('click', function(){ if (tab > 0) { tab -= 1; render(); } });
      nav.appendChild(tab > 0 ? back : el('span'));
      if (tab < 3) { var nx = el('button', {type:'button', class:'btn2 go'}, t('next') + t('tabs')[tab + 1]); nx.addEventListener('click', function(){ tab += 1; render(); }); nav.appendChild(nx); }
      else nav.appendChild(el('span', {class:'final'}, t('last')));
      pn.appendChild(nav);
      if (i === 3) pn.appendChild(buildApprove());
    }
    modal.appendChild(pn);
  });
  app.appendChild(modal); app.appendChild(notes());
  window.scrollTo(0, y);
}
function applyUI(){
  cur = postFor(UI);
  document.documentElement.setAttribute('lang', UI); document.documentElement.setAttribute('dir', UI === 'ar' ? 'rtl' : 'ltr');
  ft.textContent = t('foot'); renderHeader(); render();
}
try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch(e) {}
applyUI();
})();
